name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Verify prepared scalar canonical-energy coercivity
        run: |
          PYTHONPATH=src timeout --signal=ABRT --kill-after=30s 600s python -X faulthandler -m pytest -vv -s -o faulthandler_timeout=60 tests/test_scalar_prepared_canonical_energy_coercivity_probe_v1.py::test_prepared_canonical_energy_full_sylvester_coercivity

      - name: Run tests
        run: |
          PYTHONPATH=src timeout --kill-after=30s 1200s pytest -q --deselect=tests/test_scalar_prepared_canonical_energy_coercivity_probe_v1.py::test_prepared_canonical_energy_full_sylvester_coercivity --deselect=tests/test_charge_perturbed_zero_velocity_matching_v1.py::test_regularized_fsigma8_projection_computes_orthogonal_residual --deselect=tests/test_total_scalar_lapse_shift_hessian_v1.py::test_formal_adjoint_boundary_and_direct_certificate
          PYTHONPATH=src timeout --signal=ABRT --kill-after=30s 120s python -X faulthandler -m pytest -vv -s -o faulthandler_timeout=60 tests/test_charge_perturbed_zero_velocity_matching_v1.py::test_regularized_fsigma8_projection_computes_orthogonal_residual
          PYTHONPATH=src timeout --signal=ABRT --kill-after=30s 300s python -X faulthandler -m pytest -vv -s -o faulthandler_timeout=60 tests/test_total_scalar_lapse_shift_hessian_v1.py::test_formal_adjoint_boundary_and_direct_certificate
