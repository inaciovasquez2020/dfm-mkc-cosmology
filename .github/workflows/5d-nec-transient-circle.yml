name: Exact 5D transient acceleration NEC-DEC audit
on:
  pull_request:
    paths:
      - 'research/5d/nec_transient_accelerating_circle_exact.py'
      - 'research/5d/nec_transient_scalar_maxwell_action_audit.py'
      - 'research/5d/nec_transient_kk_hubble_gap_audit.py'
      - 'research/5d/nec_transient_extended_interval_radius_audit.py'
      - 'research/5d/nec_transient_maximal_window_audit.py'
      - 'research/5d/nec_nonexpanding_circle_hubble_bound.py'
      - 'research/5d/NEC_TRANSIENT_ACCELERATING_CIRCLE_STATUS.md'
      - '.github/workflows/5d-nec-transient-circle.yml'
  push:
    paths:
      - 'research/5d/nec_transient_accelerating_circle_exact.py'
      - 'research/5d/nec_transient_scalar_maxwell_action_audit.py'
      - 'research/5d/nec_transient_kk_hubble_gap_audit.py'
      - 'research/5d/nec_transient_extended_interval_radius_audit.py'
      - 'research/5d/nec_transient_maximal_window_audit.py'
      - 'research/5d/nec_nonexpanding_circle_hubble_bound.py'
      - 'research/5d/NEC_TRANSIENT_ACCELERATING_CIRCLE_STATUS.md'
      - '.github/workflows/5d-nec-transient-circle.yml'
permissions:
  contents: read
jobs:
  exact-nec-dec-time-interval:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Exact rational tensor, conservation, and full-interval NEC/DEC audit
        run: python3 -B research/5d/nec_transient_accelerating_circle_exact.py
      - name: Explicit canonical scalar-Maxwell action reconstruction and EOM audit
        run: python3 -B research/5d/nec_transient_scalar_maxwell_action_audit.py
      - name: Exact whole-interval KK mass versus 4D Hubble hierarchy
        run: python3 -B research/5d/nec_transient_kk_hubble_gap_audit.py
      - name: Wider exact interval and radius-adjustable KK hierarchy
        run: python3 -B research/5d/nec_transient_extended_interval_radius_audit.py
      - name: Maximal connected shrinking/NEC/acceleration interval and e-fold cap
        run: python3 -B research/5d/nec_transient_maximal_window_audit.py
      - name: General NEC Hubble comparison and stabilized-circle asymptotic no-go
        run: python3 -B research/5d/nec_nonexpanding_circle_hubble_bound.py
