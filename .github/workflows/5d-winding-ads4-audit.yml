name: Exact 5D axion winding AdS radion audit
on:
  pull_request:
    paths:
      - 'research/5d/winding_ads4_stabilization_exact_audit.py'
      - 'research/5d/WINDING_ADS4_RADION_STATUS.md'
      - '.github/workflows/5d-winding-ads4-audit.yml'
  push:
    paths:
      - 'research/5d/winding_ads4_stabilization_exact_audit.py'
      - 'research/5d/WINDING_ADS4_RADION_STATUS.md'
      - '.github/workflows/5d-winding-ads4-audit.yml'
permissions:
  contents: read
jobs:
  exact-ads4-winding:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install symbolic dependency
        run: python3 -m pip install sympy
      - name: Full five-dimensional Einstein-axion tensor and radion audit
        run: python3 -B research/5d/winding_ads4_stabilization_exact_audit.py
