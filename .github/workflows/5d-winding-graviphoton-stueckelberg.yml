name: Exact 5D winding graviphoton Stueckelberg zero-mode audit
on:
  pull_request:
    paths:
      - 'research/5d/winding_graviphoton_stueckelberg_exact.py'
      - 'research/5d/winding_nonzero_fourier_gauge_audit.py'
      - 'research/5d/WINDING_GRAVIPHOTON_STUECKELBERG_STATUS.md'
      - '.github/workflows/5d-winding-graviphoton-stueckelberg.yml'
  push:
    paths:
      - 'research/5d/winding_graviphoton_stueckelberg_exact.py'
      - 'research/5d/winding_nonzero_fourier_gauge_audit.py'
      - 'research/5d/WINDING_GRAVIPHOTON_STUECKELBERG_STATUS.md'
      - '.github/workflows/5d-winding-graviphoton-stueckelberg.yml'
permissions:
  contents: read
jobs:
  exact-zero-mode-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Exact 5D inverse metric and gauged winding mass certificate
        run: python3 -B research/5d/winding_graviphoton_stueckelberg_exact.py
      - name: Nonzero Fourier gauge invariant and mixing obstruction
        run: python3 -B research/5d/winding_nonzero_fourier_gauge_audit.py
