name: Exact 5D static circle NEC obstruction
on:
  pull_request:
    paths:
      - 'research/5d/static_circle_nec_no_go_exact.py'
      - 'research/5d/STATIC_CIRCLE_NEC_NO_GO_STATUS.md'
      - '.github/workflows/5d-static-circle-nec-no-go.yml'
  push:
    paths:
      - 'research/5d/static_circle_nec_no_go_exact.py'
      - 'research/5d/STATIC_CIRCLE_NEC_NO_GO_STATUS.md'
      - '.github/workflows/5d-static-circle-nec-no-go.yml'
permissions:
  contents: read
jobs:
  exact-nec-obstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify null contraction and wrong-sign adversarial boundary
        run: python3 -B research/5d/static_circle_nec_no_go_exact.py
