name: cosmology-check

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install symbolic dependency
        run: python3 -m pip install sympy

      - name: Invariant check
        run: ./scripts/cosmology check

      - name: Symbolic Ricci divergence identity
        run: python3 tools/verify_ricci_divergence_identity_4d_v1.py

      - name: Corrected generalized-Proca scalar-sector audit
        run: python3 tools/audit_generalized_proca_l4_scalar_sector_v1.py
