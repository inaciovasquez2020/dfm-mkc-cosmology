name: Exact mixed periodic 5D Casimir de Sitter radion certificate
on:
  pull_request:
    paths:
      - 'research/5d/mixed_periodic_spectral_ds_certificate.py'
      - 'research/5d/MIXED_PERIODIC_SPECTRAL_DS_STATUS.md'
      - '.github/workflows/5d-mixed-spectral-ds.yml'
  push:
    paths:
      - 'research/5d/mixed_periodic_spectral_ds_certificate.py'
      - 'research/5d/MIXED_PERIODIC_SPECTRAL_DS_STATUS.md'
      - '.github/workflows/5d-mixed-spectral-ds.yml'
permissions:
  contents: read
jobs:
  mixed-spectral-exact-radion:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Certify entire periodic KK sum and positive dS radion curvature
        run: python3 -B research/5d/mixed_periodic_spectral_ds_certificate.py
