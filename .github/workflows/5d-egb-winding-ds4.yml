name: Exact 5D EGB winding de Sitter background
on:
  pull_request:
    paths:
      - 'research/5d/egb_winding_ds4_exact_audit.py'
      - 'research/5d/egb_winding_kk_tensor_symbol.py'
      - 'research/5d/EGB_WINDING_DS4_STATUS.md'
      - '.github/workflows/5d-egb-winding-ds4.yml'
  push:
    paths:
      - 'research/5d/egb_winding_ds4_exact_audit.py'
      - 'research/5d/egb_winding_kk_tensor_symbol.py'
      - 'research/5d/EGB_WINDING_DS4_STATUS.md'
      - '.github/workflows/5d-egb-winding-ds4.yml'
permissions:
  contents: read
jobs:
  exact-EGB-product:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Exact 25-component field equations and restricted radion calculation
        run: python3 -B research/5d/egb_winding_ds4_exact_audit.py
      - name: Independent TT tensor Kaluza-Klein principal-symbol no-go
        run: python3 -B research/5d/egb_winding_kk_tensor_symbol.py
